# ===================================================
# CATCH-ALL (protects from bots hitting IP directly)
# ===================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/kluxin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kluxin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

server {
    ssl_certificate     /etc/letsencrypt/live/kluxin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kluxin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# ===================================================
# HTTP (ACME + Redirect)
# ===================================================
server {
    listen 80;
    listen [::]:80;  
    server_name
        test-untitled.xyz
        www.kluxin.com
        mail.kluxin.com
        www.mail.kluxin.com
        autodiscover.kluxin.com
        autoconfig.kluxin.com
        qa.kluxin.com
        www.qa.kluxin.com
        app.kluxin.com
        www.app.kluxin.com;
    server_tokens off;

    # ACME challenge for Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}